# CLBG Intelligence Track: verified public dataset registry (machine-readable copy).
# Human-readable version with selection criteria and re-verification checklist: DATASET_REGISTRY.md
# 'verified: true' means the licence/terms were confirmed from the provider page or API on 'verified_on'.
# The status (RECOMMENDED / CONDITIONAL / NOT RECOMMENDED) is the first word(s) of 'notes'.
# Maintainer: CLBG Intelligence Track Assessment Committee. Last full review: 2026-11-03.
- id: DSET-001
  name: Bank Marketing
  provider: UCI Machine Learning Repository
  url: https://archive.ics.uci.edu/dataset/222/bank+marketing
  license: CC BY 4.0
  format: CSV (semicolon-separated)
  size: 45,211 rows x 16 features (bank-full); 41,188-row 'additional' variant
  modality: tabular
  domain: banking / direct marketing (Portugal, 2008-2010)
  limitations: Field 'duration' is only known after the call, so it leaks the target and must be excluded for realistic models; class imbalance (minority 'yes'); dated, single-country.
  units:
  - DS-04
  - DS-08
  - ML-02
  - ML-04
  - ML-05
  - ML-14
  verified: true
  verified_on: '2026-11-03'
  notes: RECOMMENDED. Licence read on the UCI dataset page. Good for leakage-detection tasks.
