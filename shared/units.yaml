# CLBG Intelligence Track: Unit Registry
# This is the single source of truth for subtracks, units and tier applicability.
# `targets` is the planned number of assessments per tier. 0 means that tier is
# intentionally not offered for the unit, and `tier_notes` explains why.
# Rationale for the unit design: docs/research/architecture-decisions.md (ADR-003).

subtracks:
  data-science:
    code: DS
    name: Data Science
    focus: Turning raw data into trustworthy evidence, insight and decisions.
  ml-engineering:
    code: ML
    name: Machine Learning Engineering
    focus: Designing, training, evaluating, shipping and maintaining learning systems.
  ai-engineering:
    code: AI
    name: AI Engineering
    focus: Building reliable, secure software products on top of foundation models.

units:
  # ------------------------------------------------------------------ DATA SCIENCE
  - code: DS-01
    slug: python-and-data-wrangling
    name: Python and Data Wrangling
    subtrack: data-science
    description: Idiomatic Python, NumPy and pandas/Polars for reshaping, joining, aggregating and vectorising tabular data.
    targets: {1: 3, 2: 2, 3: 0}
    tier_notes: "Tier 3 is not offered. Advanced wrangling is assessed inside DS-11 (pipelines) and DS-12 (research), where it serves a purpose instead of being an end in itself."
  - code: DS-02
    slug: data-acquisition-and-sourcing
    name: Data Acquisition and Sourcing
    subtrack: data-science
    description: APIs, open-data portals, ethical web collection, file formats, provenance and licensing.
    targets: {1: 2, 2: 2, 3: 2}
  - code: DS-03
    slug: data-cleaning-and-quality
    name: Data Cleaning and Data Quality
    subtrack: data-science
    description: Missingness, inconsistency, deduplication, record linkage, validation rules and data-quality reporting.
    targets: {1: 3, 2: 2, 3: 2}
  - code: DS-04
    slug: exploratory-data-analysis
    name: Exploratory Data Analysis
    subtrack: data-science
    description: Systematic exploration, hypothesis generation, pitfalls such as Simpson's paradox, and documenting what the data can and cannot say.
    targets: {1: 3, 2: 2, 3: 2}
  - code: DS-05
    slug: probability-and-statistics
    name: Probability and Statistics
    subtrack: data-science
    description: Distributions, simulation, estimation, sampling, the bootstrap and Bayesian reasoning.
    targets: {1: 3, 2: 2, 3: 2}
  - code: DS-06
    slug: visualization-and-storytelling
    name: Data Visualization and Storytelling
    subtrack: data-science
    description: Perceptual principles, honest encodings, uncertainty visualisation, narrative and audience-aware communication.
    targets: {1: 3, 2: 2, 3: 2}
  - code: DS-07
    slug: sql-and-database-analytics
    name: SQL and Database Analytics
    subtrack: data-science
    description: Relational modelling, joins, window functions, analytical SQL, query performance and analytical databases.
    targets: {1: 3, 2: 2, 3: 2}
  - code: DS-08
    slug: inference-experimentation-and-causality
    name: Statistical Inference, Experimentation and Causal Thinking
    subtrack: data-science
    description: Hypothesis testing, power, multiple comparisons, A/B testing, observational causal inference and its assumptions.
    targets: {1: 2, 2: 3, 3: 3}
  - code: DS-09
    slug: decision-and-business-analytics
    name: Decision and Business Analytics
    subtrack: data-science
    description: Metric design, cohort and funnel analysis, segmentation, optimisation and decision-making under uncertainty.
    targets: {1: 2, 2: 2, 3: 2}
  - code: DS-10
    slug: time-series-and-forecasting
    name: Time-Series Analysis and Forecasting
    subtrack: data-science
    description: Decomposition, stationarity, statistical forecasting, backtesting, forecast uncertainty and hierarchical forecasts.
    targets: {1: 2, 2: 3, 3: 2}
  - code: DS-11
    slug: analytical-pipelines-and-data-engineering
    name: Analytical Pipelines and Data Engineering
    subtrack: data-science
    description: Reproducible ELT, orchestration, data contracts, incremental processing and testing of data pipelines.
    targets: {1: 2, 2: 2, 3: 2}
  - code: DS-12
    slug: applied-research-and-communication
    name: Applied Research and Reproducible Communication
    subtrack: data-science
    description: Research design, robustness and sensitivity analysis, reproducible reports, peer review and communication to decision-makers.
    targets: {1: 2, 2: 2, 3: 3}

  # ------------------------------------------------------------------ ML ENGINEERING
  - code: ML-01
    slug: mathematical-and-computational-foundations
    name: Mathematical and Computational Foundations
    subtrack: ml-engineering
    description: Linear algebra, calculus and optimisation, probability for ML, numerical stability and vectorised computation.
    targets: {1: 3, 2: 2, 3: 2}
  - code: ML-02
    slug: supervised-learning-and-ensembles
    name: Supervised Learning and Ensembles
    subtrack: ml-engineering
    description: Linear and kernel models, trees, bagging, boosting and stacking, plus the bias-variance trade-off, implemented and applied.
    targets: {1: 3, 2: 2, 3: 2}
  - code: ML-03
    slug: unsupervised-and-representation-learning
    name: Unsupervised and Representation Learning
    subtrack: ml-engineering
    description: Clustering, dimensionality reduction, density estimation, anomaly detection and learned representations.
    targets: {1: 2, 2: 2, 3: 2}
  - code: ML-04
    slug: feature-engineering-and-data-for-ml
    name: Feature Engineering and Data for ML
    subtrack: ml-engineering
    description: Encoding, leakage-safe preprocessing pipelines, feature selection, labelling quality and data-centric ML.
    targets: {1: 2, 2: 2, 3: 2}
  - code: ML-05
    slug: evaluation-validation-and-model-selection
    name: Evaluation, Validation and Model Selection
    subtrack: ml-engineering
    description: Metric choice, cross-validation design, calibration, statistical comparison of models and hyperparameter search.
    targets: {1: 2, 2: 3, 3: 2}
  - code: ML-06
    slug: neural-networks-and-deep-learning
    name: Neural Networks and Deep Learning
    subtrack: ml-engineering
    description: Backpropagation from first principles, training dynamics, regularisation, architectures and PyTorch engineering.
    targets: {1: 2, 2: 2, 3: 2}
  - code: ML-07
    slug: computer-vision
    name: Computer Vision
    subtrack: ml-engineering
    description: Image processing, CNNs, transfer learning, detection and segmentation basics, robustness and failure analysis.
    targets: {1: 2, 2: 2, 3: 2}
  - code: ML-08
    slug: natural-language-processing
    name: Natural Language Processing
    subtrack: ml-engineering
    description: Tokenisation, classical and neural text models, transformers, low-resource and African-language NLP.
    targets: {1: 2, 2: 2, 3: 2}
  - code: ML-09
    slug: time-series-machine-learning
    name: Time-Series Machine Learning
    subtrack: ml-engineering
    description: Lag features, leakage-free temporal validation, global models, sequence models and anomaly detection on streams.
    targets: {1: 1, 2: 2, 3: 2}
    tier_notes: "Tier 1 has a single assessment because foundational time-series reasoning is covered in DS-10. The ML unit concentrates on modelling at Tiers 2 and 3."
  - code: ML-10
    slug: recommender-and-ranking-systems
    name: Recommender and Ranking Systems
    subtrack: ml-engineering
    description: Collaborative filtering, matrix factorisation, implicit feedback, ranking metrics and offline evaluation pitfalls.
    targets: {1: 1, 2: 2, 3: 2}
    tier_notes: "Tier 1 has one assessment. Recommenders need supervised-learning and evaluation fluency first, so most of the unit's depth sits at Tiers 2 and 3."
  - code: ML-11
    slug: efficient-ml-and-optimization
    name: Efficient ML and Model Optimization
    subtrack: ml-engineering
    description: Profiling, quantisation, pruning, distillation, ONNX export and latency/memory budgets on CPU hardware.
    targets: {1: 0, 2: 2, 3: 2}
    tier_notes: "Tier 1 is not offered. Optimisation presupposes a working, evaluated model and a profiling mindset, both of which are Tier 2 competencies."
  - code: ML-12
    slug: model-deployment-and-serving
    name: Model Deployment and Serving
    subtrack: ml-engineering
    description: Model packaging, REST serving, containers, input validation, batch versus online inference and load testing.
    targets: {1: 2, 2: 2, 3: 2}
  - code: ML-13
    slug: ml-pipelines-mlops-and-monitoring
    name: ML Pipelines, MLOps and Monitoring
    subtrack: ml-engineering
    description: Experiment tracking, reproducible pipelines, CI for ML, model registries, drift detection and retraining policy.
    targets: {1: 1, 2: 3, 3: 2}
    tier_notes: "Tier 1 has one assessment, on experiment tracking and reproducibility. Full MLOps needs deployment fluency."
  - code: ML-14
    slug: responsible-ml
    name: Responsible ML (Fairness, Interpretability and Robustness)
    subtrack: ml-engineering
    description: Fairness metrics and trade-offs, explainability methods and their limits, adversarial and distributional robustness, model cards.
    targets: {1: 1, 2: 2, 3: 2}
    tier_notes: "Tier 1 has one assessment, on measuring group-level error disparities and reading a model card. Fairness interventions and interpretability trade-offs need independent judgement and belong at Tiers 2 and 3."

  # ------------------------------------------------------------------ AI ENGINEERING
  - code: AI-01
    slug: ai-engineering-foundations
    name: AI Engineering Foundations and Model Fundamentals
    subtrack: ai-engineering
    description: Tokens, sampling, context windows, model families and capabilities, async I/O and the engineering basics of AI applications.
    targets: {1: 3, 2: 1, 3: 0}
    tier_notes: "This is a foundational unit. Tier 2 has one assessment on tokenizer and sampling internals. Tier 3 is not offered because deeper model-internals work is assessed in AI-12 and ML-08."
  - code: AI-02
    slug: prompt-engineering-and-structured-generation
    name: Prompt Engineering and Structured Generation
    subtrack: ai-engineering
    description: Prompt design as specification, few-shot design, schema-constrained output, prompt testing and regression.
    targets: {1: 2, 2: 2, 3: 1}
    tier_notes: "Tier 3 has one assessment. Advanced prompt work quickly becomes evaluation (AI-10), context engineering (AI-08) or adaptation (AI-12), so a single research-grade prompt-optimisation study is enough here."
  - code: AI-03
    slug: model-apis-and-local-inference
    name: Model APIs and Local Inference
    subtrack: ai-engineering
    description: Provider APIs, streaming, retries and rate limits, provider abstraction and running open-weight models locally.
    targets: {1: 2, 2: 2, 3: 1}
    tier_notes: "Tier 3 has one assessment, on an inference-serving trade-off study (quantisation, batching, latency against quality). Broader serving architecture is assessed in AI-13 and ML-12."
  - code: AI-04
    slug: embeddings-and-semantic-search
    name: Embeddings and Semantic Search
    subtrack: ai-engineering
    description: Embedding models, similarity metrics, approximate nearest-neighbour indexes, hybrid lexical-semantic search and retrieval evaluation.
    targets: {1: 2, 2: 2, 3: 2}
  - code: AI-05
    slug: rag-and-knowledge-systems
    name: Retrieval-Augmented Generation and Knowledge Systems
    subtrack: ai-engineering
    description: Chunking, indexing, vector stores, reranking, grounding and citations, RAG evaluation and knowledge-base maintenance.
    targets: {1: 2, 2: 3, 3: 2}
  - code: AI-06
    slug: agents-and-tool-calling
    name: AI Agents and Tool Calling
    subtrack: ai-engineering
    description: Tool schemas, the agent loop, error recovery, permissioning, sandboxing and human-in-the-loop controls.
    targets: {1: 2, 2: 2, 3: 2}
  - code: AI-07
    slug: agentic-workflows-and-orchestration
    name: Agentic Workflows and Orchestration
    subtrack: ai-engineering
    description: Workflow versus agent patterns, multi-step pipelines, Model Context Protocol, multi-agent coordination and durable execution.
    targets: {1: 1, 2: 2, 3: 2}
    tier_notes: "Tier 1 has one assessment, a deterministic multi-step workflow with explicit state. Open-ended orchestration needs agent and evaluation fluency, so most of this unit sits at Tiers 2 and 3."
  - code: AI-08
    slug: context-engineering-and-memory
    name: Context Engineering and Memory Systems
    subtrack: ai-engineering
    description: Context budgeting, summarisation and compaction, long-term memory stores, memory retrieval and memory evaluation.
    targets: {1: 1, 2: 2, 3: 2}
    tier_notes: "Tier 1 has one assessment, on context-window budgeting and conversation summarisation. Memory architectures and retrieval-backed memory are Tier 2 and 3 work."
  - code: AI-09
    slug: multimodal-ai
    name: Multimodal AI Engineering
    subtrack: ai-engineering
    description: Vision-language models, OCR and document understanding, speech pipelines and cross-modal retrieval.
    targets: {1: 1, 2: 2, 3: 2}
    tier_notes: "Tier 1 has one assessment, using a small local vision-language or OCR pipeline with clear evaluation. Multimodal systems are resource-heavy, so deeper work is at Tiers 2 and 3, with CPU-feasible paths."
  - code: AI-10
    slug: ai-evaluation-and-observability
    name: AI Evaluation and Observability
    subtrack: ai-engineering
    description: Eval-set design, LLM-as-judge and its biases, human evaluation, tracing, regression testing and production telemetry.
    targets: {1: 2, 2: 3, 3: 2}
  - code: AI-11
    slug: ai-security-and-responsible-ai
    name: AI Security and Responsible AI
    subtrack: ai-engineering
    description: Prompt injection, data exfiltration, excessive agency, red-teaming, privacy, NDPA-aware design and harm mitigation.
    targets: {1: 1, 2: 2, 3: 2}
    tier_notes: "Tier 1 has one assessment, on recognising and testing for prompt injection and data leakage against a provided mock application. Threat modelling and defence design are Tier 2 and 3 work."
  - code: AI-12
    slug: model-adaptation
    name: Model Adaptation (Fine-tuning, PEFT and Distillation)
    subtrack: ai-engineering
    description: When to fine-tune or not, dataset curation for adaptation, LoRA/PEFT on small models, distillation and evaluation of adapted models.
    targets: {1: 0, 2: 2, 3: 2}
    tier_notes: "Tier 1 is not offered. Adaptation decisions need evaluation fluency (AI-10) and model-API experience first."
  - code: AI-13
    slug: production-ai-architecture
    name: Production AI Architecture, Cost and Reliability
    subtrack: ai-engineering
    description: Caching, routing, fallbacks, latency and cost budgets, guardrails, deployment and AI product iteration.
    targets: {1: 1, 2: 2, 3: 3}
    tier_notes: "Tier 1 has one assessment, on wrapping a model call with timeouts, retries, caching and cost logging. Architecture and reliability design are the substance of Tiers 2 and 3."
