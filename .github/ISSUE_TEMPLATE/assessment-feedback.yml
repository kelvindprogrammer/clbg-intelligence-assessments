name: Assessment feedback / problem report
description: Report an ambiguity, error, broken resource or improvement idea in an assessment.
title: "[Feedback] <ASSESSMENT-ID>: <short description>"
labels: [assessment-feedback]
body:
  - type: input
    id: assessment
    attributes:
      label: Assessment ID and version
    validations: {required: true}
  - type: dropdown
    id: kind
    attributes:
      label: Kind of issue
      options: [Ambiguous requirement, Technical error, Broken link or dataset, Starter/tests problem, Too easy/too hard for tier, Improvement idea, Other]
    validations: {required: true}
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Don't post your solution or confidential details. Describe the problem only.
    validations: {required: true}
