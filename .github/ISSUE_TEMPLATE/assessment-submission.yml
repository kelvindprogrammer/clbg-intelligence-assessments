name: Assessment submission
description: Submit completed work for evaluation. Comment the same details on your attempt issue if you prefer.
title: "[Submission] <ASSESSMENT-ID> — <github-username>"
labels: [submission]
body:
  - type: input
    id: attempt
    attributes:
      label: Attempt issue number
      placeholder: "#123"
    validations: {required: true}
  - type: input
    id: repo
    attributes:
      label: Private repository URL (the assessor account must have read access)
    validations: {required: true}
  - type: input
    id: sha
    attributes:
      label: Commit SHA being submitted
      description: The assessor marks exactly this commit.
    validations: {required: true}
  - type: textarea
    id: deviations
    attributes:
      label: Deviations from the specification (if any), with reasons
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: The acceptance criteria pass from a clean clone, using my README's steps.
          required: true
        - label: AI_USE_AND_SOURCES.md is complete and accurate.
          required: true
        - label: The repository contains no secrets and no real personal data.
          required: true
