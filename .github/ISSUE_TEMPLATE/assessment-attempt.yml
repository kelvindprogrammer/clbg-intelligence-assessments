name: Assessment attempt (register)
description: Register your attempt at an assessment, so a deadline and an assessor can be assigned.
title: "[Attempt] <ASSESSMENT-ID> — <github-username>"
labels: [attempt]
body:
  - type: input
    id: assessment
    attributes:
      label: Assessment ID
      placeholder: DS-T1-006
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Assessment version (from metadata.yaml)
      placeholder: 1.0.0
    validations: {required: true}
  - type: dropdown
    id: mode
    attributes:
      label: Collaboration mode
      options: [individual, pair, team]
    validations: {required: true}
  - type: textarea
    id: team
    attributes:
      label: Team members (pair/team only)
      description: GitHub usernames of all members
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations
      options:
        - label: I have read the whole assessment README, the rubric and the assessment integrity policy.
          required: true
        - label: I have no more than two assessments in progress.
          required: true
