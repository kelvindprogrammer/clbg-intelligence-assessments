name: New assessment proposal
description: Propose a new assessment before writing it in full.
title: "[Proposal] <subtrack> T<tier> <unit>: <working title>"
labels: [proposal]
body:
  - type: input
    id: unit
    attributes:
      label: Subtrack, tier and unit
      placeholder: ml-engineering, Tier 2, ML-05
    validations: {required: true}
  - type: dropdown
    id: format
    attributes:
      label: Format
      options: [implementation, investigation, reverse-engineering, replication, comparative, optimization, system-design, debugging-forensics, open-ended, capstone]
    validations: {required: true}
  - type: textarea
    id: pedagogy
    attributes:
      label: Pedagogical design (answer the 8 questions in the authoring guide §1)
    validations: {required: true}
  - type: textarea
    id: hook
    attributes:
      label: What makes it interesting? How does it differ from the existing assessments in this unit?
    validations: {required: true}
  - type: textarea
    id: data
    attributes:
      label: Data and resources (source, licence, or a synthetic generation plan)
    validations: {required: true}
