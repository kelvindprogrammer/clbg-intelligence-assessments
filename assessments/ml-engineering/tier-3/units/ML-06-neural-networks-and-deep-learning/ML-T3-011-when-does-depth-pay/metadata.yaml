id: ML-T3-011
title: When Does Depth Pay? A Controlled Study of Neural Networks Versus Boosted Trees on Small Agricultural
  Tables
summary: Run a controlled, seed-replicated study of when a small neural network matches or beats gradient-boosted
  trees and logistic regression on small synthetic soil tables, and defend a recommendation for an agricultural
  extension programme.
