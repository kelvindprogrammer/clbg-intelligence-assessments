id: ML-T3-001
title: "Does Adam Excuse Unscaled Features? An Experimental Study of Conditioning, Momentum and Second-Order Steps"
summary: >-
  Test the claim that an adaptive optimiser removes the need for feature scaling by implementing five optimisers on controlled ill-conditioned logistic problems, measuring iteration and cost scaling with condition number, separating scale from correlation effects, and defending the conclusion.
