competencies:
  - Turning a vague engineering claim into falsifiable hypotheses
  - Implementing gradient descent, accelerated descent, damped Newton and Adam for logistic loss
  - Defining cost fairly across first- and second-order methods
  - Handling censored (non-converged) runs correctly
  - Estimating a scaling exponent with a bootstrap interval
  - Distinguishing scale-induced from correlation-induced ill-conditioning
  - Stating the generalisation limits of a synthetic study
