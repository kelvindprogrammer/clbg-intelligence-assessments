id: ML-T3-005
title: "Do the Cooperatives Have Segments? Testing for Structure Before Clustering"
summary: >-
  Decide whether a cooperative member population contains genuine segments and how many, through preprocessing ablations, null models, a gap statistic, stability analysis and a hidden-truth evaluation that includes populations with no structure.
version: 1.0.0
status: reviewed
