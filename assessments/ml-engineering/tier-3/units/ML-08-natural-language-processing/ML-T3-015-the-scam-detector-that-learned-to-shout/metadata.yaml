id: ML-T3-015
title: "The Scam Detector That Learned to Shout: Auditing and Hardening an SMS Filter Against Style Shortcuts"
summary: >-
  Audit a synthetic SMS scam filter that relies on an urgent writing style that scammers and genuine senders later stop using consistently, find the shortcut from data with counterfactual flips, measure false-positive and recall harm across English, Pidgin and Yoruba-style messages with intervals, and defend a hardened detector and its limits.
