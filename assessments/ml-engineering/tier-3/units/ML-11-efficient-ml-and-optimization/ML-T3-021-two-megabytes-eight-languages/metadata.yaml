format: open-ended
secondary_formats: [comparative]
domains: [languages, telecoms, edge-computing, nlp]
technologies: [python, numpy, scikit-learn, pytest]
prerequisites:
  knowledge:
    - Linear and logistic models on hashed n-gram features
    - Ridge regression and its closed form
    - Quantisation, pruning and low-rank factorisation (ML-T2-022 level)
    - Confidence in an accuracy estimate (binomial standard error)
    - Experimental design (ablations and controls)
competencies:
  - Building honest size and multiply-add cost models
  - Distilling a teacher onto a smaller student using unlabelled data
  - Constructing and reading Pareto frontiers across several objectives
  - Evaluating models under distribution shift rather than on clean data
  - Selecting a deployable model with a small validation set and stating the uncertainty
  - Writing a study protocol with hypotheses, controls and threats to validity
