id: ML-T3-021
title: "Two Megabytes, Eight Languages: A Compression Study for On-Device Language Identification Under Distribution Shift"
summary: >-
  Given a 2 MB hashed n-gram language-ID teacher and an unlabelled transfer pool, build size and compute accounting, a distillation routine, Pareto analysis and a selection rule, then design and defend a study of distillation, pruning, low-rank and quantisation under a clean-to-shifted message distribution gap.
