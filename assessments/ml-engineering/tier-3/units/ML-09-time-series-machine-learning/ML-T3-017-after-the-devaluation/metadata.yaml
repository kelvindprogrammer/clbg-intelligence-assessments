id: ML-T3-017
title: "After the Devaluation: Calibrated Price Forecasts Across a Structural Break"
summary: >-
  Forecast a weekly staple-food price series through a synthetic currency shock: detect the break, decide how much history to trust, build calibrated 13-week prediction intervals, and argue the policy for the weeks right after a shock when almost no post-break data exists.
version: 1.0.0
status: reviewed
authors: ["CLBG Intelligence Track Assessment Committee"]
reviewers: ["CLBG Intelligence Track Assessment Committee"]
