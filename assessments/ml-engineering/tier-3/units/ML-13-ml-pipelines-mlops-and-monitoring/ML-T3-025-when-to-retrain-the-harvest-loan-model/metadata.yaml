id: ML-T3-025
title: "When to Retrain the Harvest-Loan Model: Cost, Label Delay and Drift Regimes in a Retraining-Policy Study"
summary: >-
  Build a delayed-label retraining simulator, design competing retraining policies, and defend a recommendation across abrupt, gradual and seasonal drift under explicit retraining and error costs, including how the answer changes with the cost and the label delay.
