id: ML-T3-023
title: "The Month Before the Labels Arrive: Designing a Safe Rollout for a Replacement Credit Model"
summary: >-
  Using a deterministic rollout simulator with delayed loan outcomes, hidden segment-level harm and silent failures, implement the statistics and an auditable rollout controller that rolls back harmful replacement models quickly, promotes good ones in reasonable time, and defend the stage, guardrail and threshold design with ablations.
