prerequisites:
  knowledge:
    - Two-proportion z tests and confidence intervals
    - A/B testing and why repeated looks inflate false positives
    - Delayed feedback and censoring in credit outcomes
    - Champion/challenger deployment
    - Non-inferiority versus superiority testing
competencies:
  - Designing a staged rollout with explicit entry and exit criteria
  - Combining immediate proxy guardrails with lagged outcome evidence
  - Protecting a small segment from harm hidden by the overall average
  - Testing non-inferiority with a stated margin
  - Quantifying the harm-versus-delay trade-off with a simulator
  - Writing an automated controller whose every decision is explained
