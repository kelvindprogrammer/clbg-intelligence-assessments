tier: 3
unit: ML-10
format: open-ended
secondary_formats: [investigation]
domains: [e-commerce, marketplaces, ranking]
technologies: [python, numpy, scikit-learn, pytest]
prerequisites:
  knowledge:
    - Logistic regression with sample weights
    - Ranking metrics and click-through rates
    - Importance (inverse-probability) weighting at an intuitive level
competencies:
  - Estimating an examination curve from a randomised slice
  - Computing an inverse-propensity estimate of a policy never deployed
  - Training a debiased ranker and comparing it with a naive click model and with the logging policy
  - Choosing clipping and normalisation and showing their bias-variance effect
  - Measuring exposure for a protected group and stating the price of changing it
  - Designing a monitoring plan for a feedback loop
