id: ML-T3-019
title: "Position Bias in the Market Feed: Learning to Rank from Clicks Without Learning Where We Put Things"
summary: >-
  Learn a ranker from position-biased marketplace click logs: estimate the examination curve from a small randomised slice, build an inverse-propensity estimator for policies that were never run, train a debiased ranker, and analyse the cost and benefit of exposing small vendors.
version: 1.0.0
status: reviewed
authors: ["CLBG Intelligence Track Assessment Committee"]
reviewers: ["CLBG Intelligence Track Assessment Committee"]
created: 2026-11-03
last_reviewed: 2026-11-03
