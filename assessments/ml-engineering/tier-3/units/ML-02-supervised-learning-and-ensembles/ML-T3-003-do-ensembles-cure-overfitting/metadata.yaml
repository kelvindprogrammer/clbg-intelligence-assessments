  - Correcting the finite-round bias of the squared-bias estimate
  - Validating an instrument with known-answer models
  - Designing ablations over depth, ensemble size, learning rate, sample size, noise and irrelevant features
  - Attaching bootstrap standard errors to decomposition terms
  - Turning folklore into testable claims and reporting verdicts with scope
