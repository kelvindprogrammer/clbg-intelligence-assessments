id: ML-T3-003
title: "Do Ensembles Cure Overfitting? A Bias-Variance Replication Study with Bagging and Boosting"
summary: >-
  Build and validate a Monte Carlo bias-variance decomposition on a synthetic cocoa-yield problem with known truth, then use it to test whether bagging and boosting reduce variance, when boosting overfits, and how noise, sample size and irrelevant features change the answer.
