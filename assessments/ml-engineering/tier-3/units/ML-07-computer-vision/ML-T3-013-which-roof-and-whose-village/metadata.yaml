id: ML-T3-013
title: "Which Roof, and Whose Village? Label-Efficient Roof Mapping with Honest Spatial Validation"
summary: >-
  Classify roof material (metal, thatch, concrete tile) in synthetic aerial tiles from ten labelled villages and a pool of unlabelled tiles, quantify how much random splits overstate accuracy, compare supervised, patch-dictionary and normalised features across label budgets, and defend which claims the evidence supports.
