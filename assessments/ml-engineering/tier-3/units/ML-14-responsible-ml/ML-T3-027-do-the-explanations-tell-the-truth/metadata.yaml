id: ML-T3-027
title: "Do the Explanations Tell the Truth? Faithfulness, Stability and Shortcut Audits for a Tuberculosis-Screening Model"
summary: >-
  Build permutation importance, sampled Shapley values, deletion-based faithfulness, stability and agreement measures and a deployment-shift shortcut audit, then study whether explanations expose a planted device shortcut across model classes, backgrounds and correlated features, and what they cannot prove.
