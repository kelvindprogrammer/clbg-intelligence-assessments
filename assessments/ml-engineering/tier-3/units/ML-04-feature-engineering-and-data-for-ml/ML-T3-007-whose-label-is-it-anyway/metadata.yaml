id: ML-T3-007
title: "Whose Label Is It Anyway? Spending a Relabelling Budget on Noisy Cassava Disease Annotations"
summary: >-
  Estimate label-noise rates per annotator, choose which labels to send for expert relabelling under a budget, train a noise-robust classifier, and defend the trade-offs between cleaning, discarding and modelling the noise, evaluated against hidden truth and a clean test set.
