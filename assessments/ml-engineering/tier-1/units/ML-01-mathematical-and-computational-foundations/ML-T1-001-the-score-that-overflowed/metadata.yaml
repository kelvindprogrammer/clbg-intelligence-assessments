id: ML-T1-001
title: "The Score That Overflowed: Numerically Stable Softmax and Logistic Loss from Scratch"
summary: >-
  Rebuild softmax, log-sum-exp, stable binary cross-entropy and softmax cross-entropy with verified gradients, then fit a logistic churn model on badly scaled telecom features without a single NaN.
