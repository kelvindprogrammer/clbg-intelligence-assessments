id: ML-T1-021
title: "The Meter Token Gatekeeper: A Validated, Checksummed Model Bundle and Prediction Function"
summary: >-
  Implement the serving contract for a prepaid-meter bypass-risk model: a strict record validator, a JSON-only checksummed model bundle with version checks, and a batch prediction function that isolates bad records. No network, no framework.
