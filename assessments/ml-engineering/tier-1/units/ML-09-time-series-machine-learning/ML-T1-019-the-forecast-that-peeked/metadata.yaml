id: ML-T1-019
title: "The Forecast That Peeked: Building a Leak-Free Walk-Forward Backtest for Feeder Load"
summary: >-
  Implement lag features, expanding-window walk-forward splits, a seasonal-naive baseline, MASE and a closed-form ridge autoregression for a synthetic daily feeder-load series, then explain why a backtest that peeks at the future is worthless.
