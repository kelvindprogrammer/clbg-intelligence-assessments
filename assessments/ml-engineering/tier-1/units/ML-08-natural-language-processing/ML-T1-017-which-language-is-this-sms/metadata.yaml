id: ML-T1-017
title: "Which Language Is This SMS? A Tokenizer, Character N-Grams and Naive Bayes from Scratch"
summary: >-
  Implement a tokenizer, character n-gram features and a multinomial naive Bayes classifier from scratch, verify the classifier against scikit-learn, and use them to identify English, Nigerian Pidgin and Yoruba-style synthetic SMS despite typos and code-switching.
