title: "Agents on the Map: K-Means and Silhouette from Scratch for Mobile-Money Agent Siting"
summary: >-
  Implement k-means++ seeding, Lloyd iterations with empty-cluster repair, multi-restart selection and the silhouette score from scratch, verify them against scikit-learn, and use them to recommend how many agent hubs a region needs.
