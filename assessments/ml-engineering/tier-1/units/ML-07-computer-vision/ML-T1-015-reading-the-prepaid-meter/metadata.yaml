id: ML-T1-015
title: "Reading the Prepaid Meter: Convolution, Pooling and Gradient Histograms from Scratch"
summary: >-
  Implement 2-D convolution, max pooling, Sobel gradients and a gradient-orientation histogram feature from scratch in numpy, then read noisy, shifted synthetic seven-segment meter digits with a nearest-centroid reader and explain why it beats raw pixels.
