prerequisites:
  knowledge:
    - Python classes and recursion
    - numpy sorting, cumsum and boolean indexing
    - Basic probability (class proportions)
    - Running pytest
competencies:
  - Computing impurity and gain exactly
  - Searching splits efficiently with sorting and cumulative class counts
  - Building and querying a recursive tree with stopping rules
  - Verifying a from-scratch model against a reference library
  - Extracting human-readable rules and checking them against the model
  - Diagnosing overfitting and the limits of greedy splitting (XOR)
