id: ML-T1-004
title: "The Field Officer's Decision Tree: A CART Classifier from Scratch for Cassava Disease Triage"
summary: >-
  Implement a Gini CART classifier with an efficient split search, importances and rule export; verify it against scikit-learn on synthetic cassava-disease data and show where greedy splitting struggles.
