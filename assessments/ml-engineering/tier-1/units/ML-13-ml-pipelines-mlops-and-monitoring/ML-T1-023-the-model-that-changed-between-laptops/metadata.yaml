id: ML-T1-023
title: "The Model That Changed Between Laptops: Fingerprints, Seeds and a Versioned Artifact Store"
summary: >-
  Build the smallest honest reproducibility layer for a mini-grid churn model: canonical data and config fingerprints, a seeded split and training run, a tamper-evident artifact store, and a run-diff that says why two models differ.
