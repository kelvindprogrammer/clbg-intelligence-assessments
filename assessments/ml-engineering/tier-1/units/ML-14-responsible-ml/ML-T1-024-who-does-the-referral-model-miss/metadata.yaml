domains: [health, responsible-ml, public-health]
technologies: [python, numpy, scikit-learn, pytest]
prerequisites:
  knowledge:
    - Confusion-matrix rates (TPR, FPR, PPV)
    - Numpy boolean indexing and grouping
    - What a confidence interval means
competencies:
  - Computing per-group error rates exactly, including undefined cases
  - Guarding against reporting on groups that are too small
  - Estimating the uncertainty of a group gap by bootstrap
  - Checking calibration within groups
  - Writing a model card that states what the numbers can and cannot support
