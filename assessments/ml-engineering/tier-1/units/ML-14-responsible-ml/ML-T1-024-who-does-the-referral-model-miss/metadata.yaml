id: ML-T1-024
title: "Who Does the Referral Model Miss? A Group-Wise Error Audit and Model Card for a Child-Health Screening Tool"
summary: >-
  Implement group-wise error rates, a small-group-safe disparity table, a group-stratified bootstrap interval for a gap, per-group calibration and a model card generator, then use them to decide which differences in a synthetic referral model are real.
version: 1.0.0
status: reviewed
authors: ["CLBG Intelligence Track Assessment Committee"]
reviewers: ["CLBG Intelligence Track Assessment Committee"]
