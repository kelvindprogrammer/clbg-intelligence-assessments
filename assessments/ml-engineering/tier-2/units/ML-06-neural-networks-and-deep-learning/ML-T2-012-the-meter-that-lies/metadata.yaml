id: ML-T2-012
title: 'The Meter That Lies: Training a Neural Network to Catch Prepaid-Meter Tampering'
summary: 'Design the training process around a provided numpy MLP to detect prepaid-meter tampering from
  skewed, imbalanced tabular data: preprocessing, early stopping, imbalance handling and loss-curve diagnosis,
  judged against a linear baseline on fresh meters.'
