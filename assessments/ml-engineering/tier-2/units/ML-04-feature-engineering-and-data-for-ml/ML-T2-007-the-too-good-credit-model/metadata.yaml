id: ML-T2-007
title: "The Too-Good Credit Model: Leakage Forensics on a Microfinance Default Model"
summary: >-
  Audit a microfinance default-prediction dataset for target leakage using documentation and evidence, rebuild a temporal and customer-disjoint evaluation, report the honest performance against the naive one, and check the honest features for drift.
