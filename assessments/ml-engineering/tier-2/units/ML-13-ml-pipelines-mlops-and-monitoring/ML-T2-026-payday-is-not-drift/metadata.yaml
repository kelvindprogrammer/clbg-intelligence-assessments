id: ML-T2-026
title: "Payday Is Not Drift: Designing a Feature-Drift Monitor for a Digital Lender's Application Stream"
summary: >-
  Implement PSI and KS drift statistics, then design a streaming monitor that stays quiet through predictable month-end seasonality and low-volume days yet catches a new acquisition channel within days, under a stated false-alarm budget.
