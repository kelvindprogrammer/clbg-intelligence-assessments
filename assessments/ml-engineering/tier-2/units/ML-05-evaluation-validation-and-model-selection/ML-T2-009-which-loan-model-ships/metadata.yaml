id: ML-T2-009
title: Which Loan Model Ships? Time-Aware Model Selection for Mobile-Money Micro-Loans
summary: Choose between candidate default models for a mobile-money micro-lender using forward-chaining
  validation, a label-maturity embargo, a leak audit and a cost-based threshold, and defend the estimate
  against what actually happens next quarter.
