id: ML-T2-005
title: "Quiet Meters: Unsupervised Detection of Electricity Theft on a Distribution Feeder"
summary: >-
  Design scale-free behavioural features and compare a magnitude baseline with isolation forest, LOF and PCA reconstruction error on synthetic feeder meter data, quantify the uncertainty of a tiny audit sample, and recommend which meters to inspect.
