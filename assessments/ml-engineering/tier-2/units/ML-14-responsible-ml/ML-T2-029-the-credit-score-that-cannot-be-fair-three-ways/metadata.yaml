id: ML-T2-029
title: "The Credit Score That Cannot Be Fair Three Ways: Fairness Metric Trade-offs and Mitigation in Micro-Lending"
summary: >-
  For a synthetic agent-banking micro-loan model with urban and rural traders, measure several fairness gaps, implement reweighing and constrained per-group thresholds, quantify the profit cost of each criterion, and defend a choice with an explicit account of what cannot be satisfied together.
