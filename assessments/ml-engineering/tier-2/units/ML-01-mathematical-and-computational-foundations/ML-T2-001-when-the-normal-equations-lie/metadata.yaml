id: ML-T2-001
title: "When the Normal Equations Lie: Fitting a Feeder-Load Model on Collinear Sensor Data"
summary: >-
  On synthetic hourly feeder data with near-duplicate sensor columns and a mid-year sensor vendor change, diagnose ill-conditioning, compare four least-squares solvers, select ridge strength by time-ordered validation and defend the final model.
version: 1.0.0
status: reviewed
authors: ["CLBG Intelligence Track Assessment Committee"]
