domains: [energy, power-distribution, numerical-linear-algebra]
technologies: [python, numpy, scikit-learn, pytest]
prerequisites:
  knowledge:
    - Ordinary least squares and the normal equations
    - Matrix rank, condition number and SVD (conceptually)
    - numpy.linalg routines
    - Train/validation splitting and cross-validation
competencies:
  - Diagnosing ill-conditioning and near-collinearity from singular values and correlations
  - Implementing and comparing least-squares solvers
  - Choosing regularisation without leaking future data
  - Distinguishing numerical error from statistical (identifiability) error
  - Justifying a method against a baseline with held-out evidence
  - Reporting limits of a fitted model under sensor drift
