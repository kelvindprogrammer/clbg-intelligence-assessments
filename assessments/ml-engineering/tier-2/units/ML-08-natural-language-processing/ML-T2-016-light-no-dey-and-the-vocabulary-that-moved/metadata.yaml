technologies: [python, numpy, scikit-learn, pytest]
prerequisites:
  knowledge:
    - TF-IDF features and logistic regression in scikit-learn
    - Macro-F1 for imbalanced classes
    - Why a validation set must resemble deployment
    - Probability outputs of classifiers
competencies:
  - Recognising a saturated validation set
  - Constructing a stress validation for noisy text
  - Comparing word and sub-word representations under drift
  - Designing augmentation that simulates misspellings
  - Routing by confidence under a review budget and checking that confidence is informative
