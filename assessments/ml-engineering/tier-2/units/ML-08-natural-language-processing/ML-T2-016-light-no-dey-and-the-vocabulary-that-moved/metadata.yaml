id: ML-T2-016
title: "Light No Dey: Complaint Triage When the Vocabulary Moves"
summary: >-
  Route synthetic mixed English and Pidgin power-utility complaints into five categories when training data come from before a tariff reform and test data after it, build a stress validation because the plain validation set is saturated, and defer the least confident messages to a human desk under a 15 percent review budget.
