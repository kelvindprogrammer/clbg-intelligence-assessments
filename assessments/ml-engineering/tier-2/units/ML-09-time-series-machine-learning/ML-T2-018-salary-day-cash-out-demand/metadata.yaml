id: ML-T2-018
title: "Salary Day at the POS Agent: Forecasting Cash-Out Demand Around Paydays and Holiday Eves"
summary: >-
  Forecast weekly cash-out volumes for 30 synthetic mobile-money agents with a pooled, causally featured model that handles paydays, holiday eves and closed days, selected against a seasonal-naive baseline with time-ordered validation.
