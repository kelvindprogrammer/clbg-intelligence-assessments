id: ML-T2-003
title: "Forty Analysts, Two Hundred Alerts: Choosing Between Linear Models, Forests and Boosting Under an Alert Budget"
summary: >-
  On synthetic mobile-money transactions with extreme imbalance, a leaky post-hoc column and mid-period fraud-pattern drift, build a leak-free pipeline, choose between logistic regression, random forest and boosting under a daily alert budget, and defend the training window.
