id: ML-T2-024
title: "Salary Day at the Loan Desk: Micro-Batching a Scoring Service Under a Latency SLO"
summary: >-
  Build an exact single-worker micro-batching simulator, fit the batch cost curve from timing data with garbage-collection spikes, and tune a batching and load-shedding policy that holds a p99 latency SLO on unseen and 25 percent heavier salary-day traffic.
