id: ML-T2-022
title: "A Kilobyte for Every Farm Node: Quantising and Pruning a Small Network to a Byte Budget"
summary: >-
  Compress a trained 24-64-32-4 irrigation-decision MLP to at most 20 percent of its float32 size using quantisation and pruning you implement yourself, choose the configuration from calibration data, and report which choices bought which saving.
