id: ML-T2-020
title: "Seeds, Fertiliser and New Arrivals: A Time-Aware Recommender with Cold-Start Items"
summary: >-
  Build a time-ordered recommender for a synthetic farm-input marketplace, compare popularity, matrix factorisation and an attribute-based hybrid, and show with a validation window that mimics deployment which one survives new product launches.
version: 1.0.0
status: reviewed
authors: ["CLBG Intelligence Track Assessment Committee"]
reviewers: ["CLBG Intelligence Track Assessment Committee"]
created: 2026-11-03
last_reviewed: 2026-11-03
next_review: 2027-08-01
collection: unit
