tier: 2
unit: ML-10
format: comparative
secondary_formats: [investigation]
domains: [agriculture, e-commerce, recommender-systems]
technologies: [python, numpy, scikit-learn, pytest]
prerequisites:
  knowledge:
    - Fitting TruncatedSVD or similar factorisation
    - Recall@k and its relation to hit rate
    - Time-ordered train and test splits
competencies:
  - Splitting purchase logs by time rather than at random
  - Fitting an implicit-feedback factorisation and a popularity baseline under one code path
  - Handling items with no history through attribute-to-factor mapping
  - Evaluating overall and on the cold-start segment separately
  - Designing the validation window so it contains the same kind of cold-start items as deployment
  - Writing a recommendation with its caveats
