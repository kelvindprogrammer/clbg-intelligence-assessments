id: ML-T2-014
title: "The Camera the Farmer Actually Owns: Leaf-Disease Triage Under Camera Shift"
summary: >-
  Train a three-class maize-leaf classifier on clean lab photos so that it works on dim, colour-cast, blurred field-phone photos, using augmentation and robust features, a 90-image field validation set and an honest account of what that set can and cannot tell you.
