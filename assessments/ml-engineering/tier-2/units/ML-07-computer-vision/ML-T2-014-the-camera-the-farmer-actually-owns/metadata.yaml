domains: [computer-vision, agriculture, plant-health]
technologies: [python, numpy, scikit-learn, pytest]
prerequisites:
  knowledge:
    - Fitting and scoring scikit-learn classifiers
    - Macro-F1 and per-class recall
    - Image arrays as (n, h, w, 3) floats
    - Why validation data should resemble deployment data
competencies:
  - Diagnosing a failure as camera shift rather than model weakness
  - Designing augmentation that mimics a target device
  - Engineering exposure- and colour-cast-robust features
  - Selecting a model on 90 target-domain images and quantifying the uncertainty
  - Reporting performance per camera and per class
