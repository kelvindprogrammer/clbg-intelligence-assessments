id: AI-T2-008
title: "The Advisory That Obeyed: Hybrid Retrieval, Hijacked Documents and Knowing When to Abstain"
summary: >-
  Engineer a farm-advisory question-answering pipeline over a mock model: hybrid lexical and dense retrieval, removal of instructions hidden in bulletins, superseded-bulletin resolution, an evidence-sufficiency gate for unanswerable and wrong-place questions, output verification, and a configuration chosen against stated quality bars.
