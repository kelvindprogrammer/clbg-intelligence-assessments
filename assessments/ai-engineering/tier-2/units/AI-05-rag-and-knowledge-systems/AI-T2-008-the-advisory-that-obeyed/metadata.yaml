competencies:
  - Combining lexical and dense rankings and checking that the combination earns its complexity
  - Treating retrieved documents as untrusted input and removing hijack text without deleting legitimate text
  - Resolving conflicting versions of the same fact using metadata
  - Deciding when evidence is insufficient and abstaining
  - Choosing a configuration against explicit bars and testing it on unseen corpora
