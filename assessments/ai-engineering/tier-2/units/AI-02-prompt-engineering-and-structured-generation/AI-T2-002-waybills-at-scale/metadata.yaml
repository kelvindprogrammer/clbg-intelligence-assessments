id: AI-T2-002
title: "Waybills at Scale: A Retrying, Validating, Cost-Aware Extraction Harness"
summary: >-
  Engineer the harness around a mock extraction model with timeouts, rate limits, refusals, malformed and wrong JSON and prompt injection: retries with a virtual clock, grounded validation, repair loops, human routing, cost accounting, and a policy chosen against a success bar.
