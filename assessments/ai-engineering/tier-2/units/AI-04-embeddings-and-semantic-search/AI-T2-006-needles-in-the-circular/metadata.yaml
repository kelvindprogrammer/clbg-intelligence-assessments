id: AI-T2-006
title: "Needles in the Circular: Chunking and Hybrid Search for a Compliance Desk"
summary: >-
  Implement chunking, BM25 and rank fusion from scratch, then build and tune a hybrid retriever over long synthetic regulatory circulars with exact-code and topic queries, and defend it against whole-document lexical and dense baselines on held-out queries.
