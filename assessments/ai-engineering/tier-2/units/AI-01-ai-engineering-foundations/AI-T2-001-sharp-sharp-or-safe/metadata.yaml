prerequisites:
  knowledge:
    - numpy vectorised operations and cumulative sums
    - Softmax and the meaning of a next-token distribution
    - Reading a precision-style acceptance criterion and testing it
competencies:
  - Implementing temperature, top-k, top-p and repetition penalty correctly, including tie and boundary cases
  - Seeded, replayable sampling from a next-token distribution
  - Explaining where beam search beats greedy decoding and where it cannot help
  - Defining generation metrics (validity, uniqueness, repetition) that match a product requirement
  - Choosing decoding parameters under competing constraints and checking they generalise to unseen seeds
