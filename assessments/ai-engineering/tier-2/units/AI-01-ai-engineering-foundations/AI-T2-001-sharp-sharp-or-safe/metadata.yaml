id: AI-T2-001
title: "Sharp Sharp or Safe: Choosing Decoding Settings for a USSD Banking Assistant"
summary: >-
  Implement softmax with temperature, top-k, top-p, repetition penalty, seeded sampling and beam search against a deterministic mock language model, then choose decoding settings that meet a validity bar and a diversity bar and still hold on held-out seeds.
