domains: [fintech, cooperatives, workflow-orchestration, reliability-engineering, nigeria]
technologies: [python, pytest]
prerequisites:
  knowledge:
    - Exceptions, retries and backoff in Python
    - Directed graphs and topological layering
    - Writing tests with scripted fake services
competencies:
  - Validating a model-generated plan statically before executing any step
  - Running independent steps in parallel on a virtual clock and measuring the makespan
  - Using idempotency keys so that ambiguous timeouts cannot cause double effects
  - Compensating completed and possibly-completed steps in reverse order
  - Gating consequential actions behind human approval and proving it with tests
