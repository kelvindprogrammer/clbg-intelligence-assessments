id: AI-T2-013
title: "The Double Credit: A Compensating Orchestrator for AI-Planned Loan Disbursement"
summary: >-
  Engineer an orchestrator for a mock-LLM-generated disbursement plan: static plan validation and repair, dependency waves with a parallel makespan, retries with idempotency keys against timeouts that applied the effect, reverse-order compensation including the failed step, an approval gate, and a consistency audit of the simulated ledger.
