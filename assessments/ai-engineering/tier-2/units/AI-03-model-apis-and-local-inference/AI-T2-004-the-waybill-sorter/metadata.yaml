id: AI-T2-004
title: "Six Hundred Waybills, Two Providers, One Outage: Batching, Caching and Failover for a Freight Classifier"
summary: >-
  Build a gateway over two deterministic mock model providers with sliding-window rate limits, an outage, malformed replies and batch-position quality decay: dedupe and cache, batch, fail over, enforce a budget and choose the batch size from labelled evidence, then beat a naive loop on cost and time at equal accuracy.
