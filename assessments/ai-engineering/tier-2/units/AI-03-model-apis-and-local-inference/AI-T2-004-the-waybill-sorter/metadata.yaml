  - "Choosing a batch size from measured accuracy rather than assumption"
  - "Caching on a normalised key and quantifying the saving"
  - "Designing failover with cooldown so a provider outage costs neither correctness nor money"
  - "Enforcing a spend budget and reconciling it against provider billing"
  - "Comparing a gateway with a naive baseline on cost, makespan and accuracy"
