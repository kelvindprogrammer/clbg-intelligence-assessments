id: AI-T3-001
title: "Is Prompt B Really Better? A Regression Gate for Prompts in a Multilingual Care Bot"
summary: >-
  Design and implement a statistically defensible regression gate for prompt changes in a multilingual care bot, measure its false-block and detection rates by simulation against a prompt-sensitive mock, and argue what the protocol can and cannot establish.
