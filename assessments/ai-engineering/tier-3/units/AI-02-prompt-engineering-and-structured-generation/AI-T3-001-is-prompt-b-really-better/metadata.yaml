prerequisites:
  knowledge:
    - Bootstrap confidence intervals and what clustering does to them
    - Type I error, power and multiple comparisons
    - Reading a simulation study and its assumptions
competencies:
  - Choosing the unit of resampling and pairing for LLM evaluation with item difficulty and sampling noise
  - Controlling error across language and attack slices
  - Planning evaluation set size from effect size and variance
  - Estimating a gate's false-block and detection rates by simulation
  - Detecting contamination between prompts and evaluation sets
  - Writing a validity argument that separates what the mock shows from what real deployments need
