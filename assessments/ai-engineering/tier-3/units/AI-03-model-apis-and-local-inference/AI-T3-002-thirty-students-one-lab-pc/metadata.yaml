id: AI-T3-002
title: "Thirty Students, One Lab PC: A Quantisation and Batching Study for Local Inference"
summary: >-
  Implement low-bit quantisation and a static/continuous batching simulator for a toy language model with planted outlier channels and an analytic CPU cost model, then recommend, defend and stress-test a quantisation and batching configuration for a 30-student campus lab under a p95 latency SLO.
