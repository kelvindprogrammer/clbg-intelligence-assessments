id: AI-T3-005
title: "The Audit That Finds the Flaw: Validating a RAG Evaluation Harness with Planted Faults"
summary: >-
  Design and validate an evaluation harness for retrieval-augmented systems: retrieval, faithfulness, citation, abstention and rank-sensitivity metrics with bootstrap intervals, then prove by planted-fault experiments that it diagnoses the right flaw, avoids false alarms under background noise, and has quantified power.
