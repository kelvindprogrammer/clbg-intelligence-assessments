technologies: [python, pytest]
prerequisites:
  knowledge:
    - Bootstrap resampling and confidence intervals
    - Precision, recall and the idea of a confound
    - Having built or studied a small RAG pipeline
competencies:
  - Separating retrieval failure from generation failure in an evaluation design
  - Choosing metrics whose conditioning populations make attribution possible
  - Using bootstrap intervals to control false alarms at small sample sizes
  - Validating an evaluator with planted faults and reporting detection power
  - Arguing the limits of a synthetic validity study
