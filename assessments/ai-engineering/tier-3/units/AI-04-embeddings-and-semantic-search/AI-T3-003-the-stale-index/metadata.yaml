id: AI-T3-003
title: "The Stale Index: Approximate Nearest-Neighbour Search for a Marketplace Whose Catalogue Keeps Moving"
summary: >-
  Implement k-means and an inverted-file ANN index with exact distance accounting on a synthetic marketplace catalogue with head and tail queries and distribution drift, then choose a recall-versus-cost configuration, measure the harm of a stale index, and design and calibrate a rebuild policy with a threats-to-validity analysis.
