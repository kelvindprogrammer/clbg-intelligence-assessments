  - "Measuring the recall-versus-cost frontier and choosing a configuration under a budget"
  - "Decomposing quality by query segment and explaining why averages hide failures"
  - "Quantifying how appends without retraining degrade an index and detecting it from unlabelled signals"
  - "Designing and calibrating a rebuild policy against a stated definition of harm"
  - "Arguing what a synthetic generator can and cannot support"
