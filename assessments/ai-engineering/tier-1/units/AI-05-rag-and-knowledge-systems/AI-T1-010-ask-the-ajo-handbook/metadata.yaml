id: AI-T1-010
title: "Ask the Ajo Handbook: Chunk, Retrieve, Cite"
summary: >-
  Build the smallest honest RAG pipeline by hand: word-window chunking, a BM25 index from the formula, a budgeted context, citation extraction and checking against what was actually retrieved, abstention, and recall and MRR, all against a deterministic mock answerer.
