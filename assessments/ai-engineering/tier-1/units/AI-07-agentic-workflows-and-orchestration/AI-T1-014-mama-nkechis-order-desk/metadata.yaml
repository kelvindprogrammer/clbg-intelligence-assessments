id: AI-T1-014
title: "Mama Nkechi's Order Desk: A Workflow Engine with Explicit State"
summary: >-
  Implement a small workflow engine (routing by label, step retries, loop guards, human pause and resume, static graph validation) and an order-desk graph around a deterministic mock model, then explain why a fixed workflow suits this job better than an agent.
