id: AI-T1-001
title: "Kobo per Token: Building a Byte-Pair Tokeniser for a Lagos SMS Assistant"
summary: >-
  Implement a byte-pair-encoding trainer, encoder, decoder, vocabulary and token-cost calculator with exact tie-breaking, then measure and explain how an English-first tokeniser taxes Yoruba and Pidgin users.
