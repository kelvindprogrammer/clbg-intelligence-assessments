    - JSON with the json module
    - Writing simple pytest tests
competencies:
  - Validating tool arguments against a declared schema and reporting precise errors
  - Containing tool failures so that the loop continues
  - Parsing a tool call out of free text without being fooled by braces inside strings
  - Keeping sensitive fields out of the model context and the trace
  - Bounding an agent loop so a stuck model cannot run forever
