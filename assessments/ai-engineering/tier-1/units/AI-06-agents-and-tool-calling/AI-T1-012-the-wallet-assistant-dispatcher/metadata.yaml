id: AI-T1-012
title: "The Wallet Assistant Dispatcher: Typed Tools, Parsed Calls and a Bounded Loop"
summary: >-
  Build the plumbing under every tool-calling agent: argument validation against a typed schema, a tool registry that never raises, a parser for messy model output, redaction of sensitive fields, and a step-bounded agent loop, all against a deterministic scripted model.
