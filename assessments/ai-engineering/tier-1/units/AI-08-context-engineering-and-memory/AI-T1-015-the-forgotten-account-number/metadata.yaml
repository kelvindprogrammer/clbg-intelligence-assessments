technologies: [python, pytest]
prerequisites:
  knowledge:
    - Python lists, dictionaries and the re module
    - Running pytest and reading a failing assertion
    - The idea that a model only sees what is placed in its prompt
competencies:
  - Counting tokens by an explicit rule and budgeting a window with a reply reserve
  - Dropping history without leaving holes and without losing pinned messages
  - Replacing dropped history by a bounded summary inside the budget
  - Measuring what a context strategy forgets
  - Explaining the trade-off between truncation, summarisation and pinning
