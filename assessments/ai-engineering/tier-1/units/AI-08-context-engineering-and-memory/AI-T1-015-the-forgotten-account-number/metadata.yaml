id: AI-T1-015
title: "The Forgotten Account Number: Context Budgeting for a Bank Support Chat"
summary: >-
  Implement a token counter, a window fitter with pinned messages and a reply reserve, a summary-based compaction step, a fact-retention metric and a budget report, then measure what each strategy forgets in a synthetic bank-support chat.
