prerequisites:
  knowledge:
    - Python string handling and regular expressions
    - JSON objects, arrays and escaping
    - Reading a failing pytest assertion
competencies:
  - Building prompts from a strict template without silent substitution errors
  - Selecting few-shot examples deterministically and fitting a prompt to a budget
  - Delimiting untrusted text so it cannot forge the prompt's structure
  - Extracting and validating structured output without trusting its format
  - Writing an end-to-end wrapper that returns a result instead of raising on model misbehaviour
