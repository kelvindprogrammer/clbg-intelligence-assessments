id: AI-T1-004
title: "The Maize SMS Prompt Kit: Templates, Few-Shot Selection, Fencing and Strict Parsing"
summary: >-
  Implement a strict prompt template renderer, an injection-resistant fence, deterministic few-shot selection with a word budget, a robust JSON extractor and a schema validator, and wire them into a triage function that survives a mock model's formatting failures and a prompt-injection attempt.
