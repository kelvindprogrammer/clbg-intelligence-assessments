id: AI-T1-008
title: "The Longer Complaint Wins: Building and Evaluating Similarity Search from Scratch"
summary: >-
  Implement row normalisation, dot, cosine and L2 scoring, deterministic top-k, recall@k, MRR and nDCG@k from scratch on a deterministic toy embedder, then show and explain why dot-product search is captured by long boilerplate documents while cosine search is not.
