id: DS-T2-011
title: "One House Style: An Accessible, Regression-Tested Chart Style System"
summary: >-
  Build a research desk's chart style system: implement CVD simulation, colour difference and WCAG
  contrast; design a palette that beats tab10 under an independent audit; provide a theme and
  annotation API; and calibrate a visual-regression check from measured benign and meaningful changes.
