id: DS-T2-012
title: "The Tariff Band Explorable: Explaining an Electricity Policy Trade-off to Households"
summary: >-
  Build a sourced, tested model and a phone-friendly explorable explanation of the trade-off between
  electricity tariff bands, supply hours and backup-power costs, then evaluate it with 3-5 consenting
  participants against a static baseline and revise it.
