    - Basic HTML, CSS and JavaScript
    - Honest encodings and uncertainty display at DS-06 Tier 1 level
  recommended_assessments: [DS-T1-016]
competencies:
  - Framing a policy trade-off as a small, transparent, tested model
  - Verifying and citing parameters from primary regulatory sources
  - Designing explorable explanations documented by machine-readable view specs
  - Running consented, pseudonymous small-sample usability studies against a baseline
  - Reporting findings honestly and revising a design in response
