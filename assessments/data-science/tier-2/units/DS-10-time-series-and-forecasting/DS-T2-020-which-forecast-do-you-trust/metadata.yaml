id: DS-T2-020
title: "Which Forecast Do You Trust? Benchmarking Load Forecasts with Honest Intervals on Power Feeders"
summary: >-
  Build a benchmark harness and your own forecaster for eight synthetic power-feeder load series, then show with leak-free rolling-origin evidence that it beats a seasonal-naive baseline in accuracy while its 80% intervals are honestly calibrated.
