id: DS-T2-013
title: "The Slow Meter Report: Making Five Analytical Queries Fast Without Making Them Wrong"
summary: >-
  Rewrite five slow, correlated-subquery reports over a prepaid-electricity vend database using window functions and well-chosen indexes. Prove identical results and measure deterministic work, then show how cost scales with data size.
