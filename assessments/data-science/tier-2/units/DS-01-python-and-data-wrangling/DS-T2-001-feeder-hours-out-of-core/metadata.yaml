id: DS-T2-001
title: "Feeder Hours, Out of Core: pandas vs Polars vs DuckDB on Smart-Meter Data"
summary: >-
  Compute feeder supply hours and tariff-band compliance from 8 million synthetic smart-meter
  readings four ways (pandas baseline, chunked pandas, Polars, DuckDB) with identical results, then
  benchmark time and memory under an 8 GB-laptop budget and recommend a tool for a DisCo team.
