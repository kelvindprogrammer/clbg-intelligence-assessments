id: DS-T2-007
title: "Rain Before the Price: Multi-Source EDA of Rainfall Anomalies and Food Prices"
summary: >-
  Explore 12 years of state rainfall, staple prices and national macro shocks across 18 Nigerian
  states (synthetic, stylised). Isolate local rainfall signals from national inflation, search lags
  without fooling yourself, control the false discovery rate, beat a naive baseline and deliver a hypothesis register.
