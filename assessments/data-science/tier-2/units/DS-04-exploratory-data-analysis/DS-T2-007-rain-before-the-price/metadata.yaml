technologies: [python, pandas, numpy, scipy, matplotlib, pytest]
prerequisites:
  knowledge:
    - Time-series seasonality, trend, lags and autocorrelation
    - Linear regression and p-values
    - The multiple-comparisons problem
    - pandas reshaping (pivot, merge, groupby)
  recommended_assessments: [DS-T1-009, DS-T1-011]
competencies:
  - Aligning and exploring a multi-source panel, including missingness patterns
  - Separating common shocks from local signals
  - Valid inference under lag search, seasonality and autocorrelation
  - False discovery rate control across many hypotheses
  - Simulation-based validation of an analysis method against a baseline
  - Building a prioritised hypothesis register with follow-up actions
