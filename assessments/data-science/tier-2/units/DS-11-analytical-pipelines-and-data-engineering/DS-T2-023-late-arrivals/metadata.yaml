id: DS-T2-023
title: "Late Arrivals: Incremental Revenue Aggregation with Watermarks, Corrections and Bounded Memory"
summary: >-
  Implement an incremental daily-revenue aggregator for an airtime top-up event stream that handles late events, redeliveries and versioned corrections, keeps memory bounded, restarts from a JSON checkpoint, and quantifies what each lateness setting costs.
