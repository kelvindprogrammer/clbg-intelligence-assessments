id: DS-T2-004
title: "Rain, Grain and Granularity: Fusing Open Climate, Crop and Development Data at Mismatched Scales"
summary: >-
  Acquire NASA POWER daily climate, FAOSTAT national crop statistics and World Bank indicators for Nigeria,
  align them with tested rules for seasons, coverage, flags and trends, and compare at least four alignment
  designs against a baseline to show how robust any climate-yield conclusion really is.
