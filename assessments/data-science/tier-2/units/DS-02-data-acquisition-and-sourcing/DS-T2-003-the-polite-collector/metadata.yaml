domains: [public-procurement, civic-technology, open-government-data]
technologies: [python, http, html-parsing, robots-txt, pytest]
prerequisites:
  knowledge:
    - HTTP requests, status codes and headers
    - HTML document structure
    - Python packages, modules and pytest
    - JSON or SQLite storage
  recommended_assessments: [DS-T1-004]
competencies:
  - RFC 9309 robots semantics and crawl-delay compliance
  - Turning terms of use into design requirements
  - Crawl scoping, URL canonicalisation and request budgets
  - Change detection with conditional HTTP and sitemaps
  - Schema-drift detection that protects stored data
  - Data minimisation for personal data under NDPA 2023
  - Measured comparison of collection strategies against a baseline
