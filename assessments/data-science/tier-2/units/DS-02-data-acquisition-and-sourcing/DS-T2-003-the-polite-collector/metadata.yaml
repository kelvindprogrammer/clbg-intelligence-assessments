id: DS-T2-003
title: "The Polite Collector: Ethical, Change-Aware Collection from a Public Procurement Portal"
summary: >-
  Design and build a web collector for a mock state e-procurement portal that honours RFC 9309 robots
  rules, crawl delays and the terms, detects amendments and withdrawals cheaply with conditional requests,
  raises schema-drift alarms instead of writing nulls, and is measured against a naive baseline.
version: 1.0.0
status: reviewed
authors: ["CLBG Intelligence Track Assessment Committee"]
reviewers: ["CLBG Intelligence Track Assessment Committee"]
