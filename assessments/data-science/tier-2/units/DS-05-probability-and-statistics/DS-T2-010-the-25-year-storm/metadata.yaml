id: DS-T2-010
title: "The 25-Year Storm: Extreme Value Analysis of Rainfall for Drainage Design"
summary: >-
  Estimate 25- and 100-year one-day rainfall for culvert design from a 44-year gauge record
  with outages and clustered storms, using GEV and peaks-over-threshold models with calibrated
  uncertainty, and decide what a weakly detectable trend means for a 40-year design life.
