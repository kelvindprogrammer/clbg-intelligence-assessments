id: DS-T2-009
title: "Small Schools, Big Swings: Empirical Bayes for School Pass Rates"
summary: >-
  Build and compare shrinkage estimators of 600 schools' pass rates when cohorts range from 2
  to 250, design an evaluation against noisy held-out data, and choose award and intervention
  lists that reward excellence rather than luck.
