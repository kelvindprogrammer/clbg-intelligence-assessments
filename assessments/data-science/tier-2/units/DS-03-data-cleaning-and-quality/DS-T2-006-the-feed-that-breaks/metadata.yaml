id: DS-T2-006
title: "The Feed That Breaks: A Data Contract and Validation Framework for a Partner Feed"
summary: >-
  Design a data contract and a contract-driven validation framework for daily agent-banking
  deliveries from a partner: schema, semantic, freshness, volume and distribution checks,
  row and delivery quarantine, calendar-aware baselines and alerting, judged on unseen sequences.
version: 1.0.0
status: reviewed
authors: ["CLBG Intelligence Track Assessment Committee"]
