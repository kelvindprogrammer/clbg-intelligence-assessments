  knowledge:
    - Solid pandas
    - Python packaging and pytest fixtures
    - YAML or JSON configuration
    - Medians, ratios and simple baselines
  recommended_assessments: [DS-T1-008]
competencies:
  - Writing data contracts with owners, severities and justified thresholds
  - Contract-driven schema and semantic validation
  - Freshness, duplicate-delivery and manifest checks
  - Calendar-aware volume and distribution baselines learned from trusted data
  - Row-level versus delivery-level quarantine
  - Alert severity and routing design
  - Fault-injection testing
  - Security and operational design for untrusted partner input
