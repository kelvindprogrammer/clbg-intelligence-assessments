domains: [health, public-sector-records, health-information-systems]
technologies: [python, pandas, numpy, pytest]
prerequisites:
  knowledge:
    - pandas merges and groupby
    - Conditional probability, likelihood ratios and logarithms
    - Precision, recall and F1
    - String similarity concepts (edit distance, Jaro-Winkler)
  recommended_assessments: [DS-T1-006]
competencies:
  - Standardising heterogeneous registers for linkage
  - Blocking design measured by pair completeness and reduction ratio
  - Fellegi-Sunter comparison vectors, m/u probabilities and match weights
  - Parameter estimation by EM and from a clerical sample
  - Threshold and clerical-review band selection
  - Fair comparison against a deterministic baseline with uncertainty
  - Linkage error analysis
  - Privacy safeguards for health-data linkage
