id: DS-T2-005
title: "Same Patient, Two Registers: Probabilistic vs Deterministic Record Linkage"
summary: >-
  Link a primary health centre register to a general hospital register with no shared ID.
  Build a deterministic baseline and a Fellegi-Sunter linker with blocking, compare them on the
  precision-recall trade-off using a clerical sample, and recommend an operating point.
version: 1.0.0
status: reviewed
authors: ["CLBG Intelligence Track Assessment Committee"]
reviewers: ["CLBG Intelligence Track Assessment Committee"]
created: 2026-11-03
last_reviewed: 2026-11-03
next_review: 2027-08-01
collection: unit
