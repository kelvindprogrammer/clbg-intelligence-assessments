id: DS-T2-025
title: "Robust or Fragile? A Specification-Curve and Sensitivity Analysis of a Mobile-Banking Training Programme"
summary: >-
  Investigate whether a mobile-banking training programme raised household savings in confounded survey data: implement the estimators, run a 48-specification curve, identify which controls are bad (mediator, collider) and why, quantify sensitivity to unmeasured confounding, and write a proportionate conclusion.
