id: DS-T1-029
title: "The Claim in the Press Release: Auditing a School-Meals Attendance Claim with Honest Intervals"
summary: >-
  Audit a press release's claim that a school-meals programme raised attendance: implement interval methods from their formulas, estimate a difference-in-differences with a school-level bootstrap, show how pupil-level intervals overstate certainty, and record a reproducibility manifest.
