id: DS-T1-010
title: "Hours on the Feeder: Supply-Hours Exploration of Electricity Outage Logs"
summary: >-
  Turn six months of messy control-room outage logs from a fictional Nigerian distribution company
  into defensible daily supply hours, then use dependence-aware bootstrap intervals to find which
  feeders are confidently failing their NERC service band and how naive processing distorts the answer.
