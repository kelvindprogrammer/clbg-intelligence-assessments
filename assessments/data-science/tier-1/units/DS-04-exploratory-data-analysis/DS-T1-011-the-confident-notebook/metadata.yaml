id: DS-T1-011
title: "The Confident Notebook: Auditing the Claims of an Exploratory Analysis"
summary: >-
  Audit a polished but flawed exploratory notebook from a fictional mobile-money operator. For each
  of ten claims, decide whether the data supports it, name the flaw (survivorship, base rates, log
  scales, confounding, ecological fallacy, regression to the mean and more) and compute the correct figure.
