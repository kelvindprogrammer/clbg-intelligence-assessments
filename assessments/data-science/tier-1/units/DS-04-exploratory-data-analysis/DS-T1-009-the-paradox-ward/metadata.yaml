id: DS-T1-009
title: "The Paradox Ward: Stratified Exploration of Hospital Outcome Rankings"
summary: >-
  A draft hospital league table ranks the network's referral centre last on crude 30-day mortality.
  Stratify, standardise and decompose the rates to discover a Simpson's reversal, tell confounders
  from proxies and non-confounders, and advise the Commissioner on what the data can and cannot show.
