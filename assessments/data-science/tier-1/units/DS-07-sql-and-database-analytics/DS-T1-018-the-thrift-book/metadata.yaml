id: DS-T1-018
title: "The Thrift Book: Ten Questions for a Market Cooperative"
summary: >-
  Answer ten specified business questions about a market thrift (ajo/esusu) cooperative with SQL. The data hides a join fan-out, NULL channels, double postings and overpaid loans that make natural-looking queries wrong.
