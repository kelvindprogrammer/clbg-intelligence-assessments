id: DS-T1-004
title: "Every Page, Exactly Once: A Resilient Client for the World Bank Indicators API"
summary: >-
  Build a paginated World Bank API client with retries, jittered backoff, an integrity-checked cache
  and a provenance log. It must survive the API's real traps (HTTP-200 errors, nulls, republished
  vintages) and is tested fully offline against recorded responses and a fault-injecting fake server.
