id: DS-T1-005
title: "Four Agencies, One Price: Parsing and Reconciling Heterogeneous Food-Price Files"
summary: >-
  Parse JSON, XML, a multi-sheet Excel workbook and a legacy fixed-width file describing the same
  staple-food prices into one canonical table. Then classify each surviving cross-agency anomaly as a
  parsing error, a source defect or a real market event, with evidence.
