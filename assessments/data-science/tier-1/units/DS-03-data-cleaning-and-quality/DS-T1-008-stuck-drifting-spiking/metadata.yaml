id: DS-T1-008
title: "Stuck, Drifting, Spiking: Validation Rules for a Low-Cost Air-Quality Network"
summary: >-
  Implement exactly specified validation rules for five low-cost PM2.5/temperature/humidity
  monitors in Lagos: range, stuck-value and Hampel spike checks, robust clock-drift estimation,
  gap detection, a bitmask quality-flag scheme and completeness-aware hourly means.
version: 1.0.0
status: reviewed
authors: ["CLBG Intelligence Track Assessment Committee"]
reviewers: ["CLBG Intelligence Track Assessment Committee"]
