domains: [environment, air-quality, iot-sensors, climate]
technologies: [python, pandas, numpy, scipy, pytest]
prerequisites:
  knowledge:
    - pandas time series (to_datetime, sorting, groupby)
    - NumPy arrays
    - Median and median absolute deviation
    - Bitwise operators
    - Running pytest
  recommended_assessments: [DS-T1-006]
competencies:
  - Implementing time-series validation rules exactly to specification
  - Robust spike detection with the Hampel rule
  - Run-length detection of stuck sensors
  - Robust clock offset and drift estimation (Theil-Sen)
  - Distinguishing late uploads from clock faults
  - Designing and applying a bitmask quality-flag scheme
  - Completeness rules for aggregated data
