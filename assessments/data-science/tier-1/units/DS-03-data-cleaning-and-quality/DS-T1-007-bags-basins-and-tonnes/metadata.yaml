id: DS-T1-007
title: "Bags, Basins and Tonnes: Harmonising a Smallholder Harvest Survey"
summary: >-
  Convert a smallholder harvest survey recorded in bags, basins, mudus and tonnes to kilograms
  with crop-specific factors and uncertainty bounds, flag implausible yields with robust rules,
  and investigate how much each cleaning decision changes the production total.
version: 1.0.0
status: reviewed
authors: ["CLBG Intelligence Track Assessment Committee"]
reviewers: ["CLBG Intelligence Track Assessment Committee"]
created: 2026-11-03
