id: DS-T1-006
title: "The Registry That Lies: Forensic Cleaning of a Student Records Export"
summary: >-
  Profile and clean a deliberately corrupted university registry export. Recover what can be
  recovered, flag what cannot, consolidate duplicates without merging namesakes, and detect a
  hidden systemic grading-scale defect from data.
