id: DS-T1-016
title: "Honest About Uncertainty: Interval Plots, Quantile Dotplots and Fan Charts"
summary: >-
  Build a tested library that turns survey estimates and quantile forecasts into honest displays
  (Wilson interval plots, threshold-aligned quantile dotplots, nested fan charts), refuse incoherent
  forecasts, and write a one-page market bulletin for a maize-storage decision.
