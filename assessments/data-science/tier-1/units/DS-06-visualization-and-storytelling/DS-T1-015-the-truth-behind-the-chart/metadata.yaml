id: DS-T1-015
title: "The Truth Behind the Chart: Forensics of Misleading Graphics"
summary: >-
  Audit a gallery of published charts against an exact defect policy (truncated bars, dual axes,
  cherry-picked windows, area distortion, misleading colormaps, inverted axes, missing sources),
  compute Tufte's lie factor, and redraw each chart honestly as an inspectable matplotlib Figure.
