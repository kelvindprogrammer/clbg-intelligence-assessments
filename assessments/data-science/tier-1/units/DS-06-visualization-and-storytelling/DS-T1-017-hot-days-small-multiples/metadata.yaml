id: DS-T1-017
title: "Hot Days, Six Cities: A Small-Multiples Climate Story from NASA POWER"
summary: >-
  Parse real NASA POWER reanalysis data for six Nigerian cities, compute hot-day indicators under
  fixed and city-relative thresholds with explicit missing-data rules, and tell an honest
  small-multiples story about whether hot days are becoming more common.
