id: DS-T1-013
title: "How Sure Are We? Bootstrap and Analytical Intervals Under a Coverage Experiment"
summary: >-
  Implement t, Wald, Wilson, exact and bootstrap (percentile, basic, BCa) intervals from scratch,
  test their 95% promise with a Monte Carlo coverage experiment, and report honest intervals
  for a skewed, rare-event survey of POS and mobile-money agents.
