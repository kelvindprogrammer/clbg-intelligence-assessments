id: DS-T1-012
title: "The Fuel Queue: Simulating a Filling Station During Scarcity"
summary: >-
  Derive the M/M/c results, build and validate a queue simulator, estimate demand from a
  filling-station log with balking, and decide how many pumps to staff when the exponential
  textbook model is quietly optimistic.
version: 1.0.0
status: reviewed
authors: ["CLBG Intelligence Track Assessment Committee"]
