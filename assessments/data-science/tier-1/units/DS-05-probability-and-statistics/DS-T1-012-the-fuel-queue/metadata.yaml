technologies: [python, numpy, scipy, pandas, pytest]
prerequisites:
  knowledge:
    - Python functions, modules and dataclasses
    - NumPy arrays and numpy.random.Generator
    - Exponential and Poisson distributions
    - Confidence intervals at introductory level
    - Running pytest
  recommended_assessments: []
competencies:
  - Deriving M/M/c steady-state results from birth-death balance equations
  - Implementing and verifying a discrete-event FCFS multi-server simulation
  - Validating a simulator against analytical results
  - Output analysis for autocorrelated simulation series (warm-up, batch means)
  - Input modelling from operational logs, including censored demand (balking)
  - Separating simulation uncertainty from input uncertainty in a decision
