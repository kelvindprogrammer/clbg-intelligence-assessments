id: DS-T1-014
title: "Collision Course: How Long Must a Booking Reference Be?"
summary: >-
  Derive and stably compute birthday-problem collision probabilities, verify them by simulation,
  use two days of BRT booking references to show the generator's real code space is about 50
  times smaller than designed, and recommend a reference length and design.
