id: DS-T1-027
title: "Run It Twice: An Idempotent, Auditable Loader for Daily Market-Levy Files"
summary: >-
  Build a small SQLite loader for daily market-levy files that is safe to run twice, survives a crash mid-file, never drops a row silently, and can prove that every input row is accounted for.
