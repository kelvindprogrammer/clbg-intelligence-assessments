id: DS-T1-002
title: "The Ledger That Double-Counts: Debugging a Mobile-Money Settlement Pipeline"
summary: >-
  A legacy POS agent-banking settlement script runs cleanly but pays the wrong commission. Find
  every defect against its docstring specification, prove each with a failing test, fix it,
  reconcile with the switch's control totals, and measure what each defect cost.
