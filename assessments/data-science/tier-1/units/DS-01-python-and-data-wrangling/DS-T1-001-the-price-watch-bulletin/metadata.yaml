id: DS-T1-001
title: "The Price Watch Bulletin: From Spreadsheet Export to Tidy Data"
summary: >-
  Reshape a print-formatted, multi-table state food price bulletin (merged headers, page breaks,
  footnote notation, summary rows) into tested tidy data, then recompute every published average
  to discover how the national figure is really built and which averages are inconsistent.
