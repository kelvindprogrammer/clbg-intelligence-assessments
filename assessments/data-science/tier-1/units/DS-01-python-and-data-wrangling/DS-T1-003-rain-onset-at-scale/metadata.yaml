id: DS-T1-003
title: "Rain Onset at Scale: Vectorising an Agro-Climate Pipeline Without Changing Its Answers"
summary: >-
  Profile a correct but loop-bound rainfall pipeline (monthly totals, dry spells, agronomic onset
  dates, anomalies), re-implement it with NumPy and pandas, prove equivalence against the legacy
  oracle on adversarial inputs, and measure the speed-up with a fair benchmark protocol.
