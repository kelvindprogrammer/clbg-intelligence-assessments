id: DS-T3-022
title: "Referee Report: Auditing an Industry Whitepaper's Causal Claim and Re-analysing the Data"
summary: >-
  Referee a fictional lender's whitepaper claiming its credit model halves defaults: build tools that expose cohort composition, censoring, subgroup fishing and a post-hoc threshold, re-analyse the loan data defensibly, and write a prioritised referee report with a proportionate recommendation.
