collection: unit
subtrack: data-science
tier: 3
unit: DS-11
format: system-design
secondary_formats: [implementation]
domains: [agriculture, price-statistics]
technologies: [python, pandas, pyyaml, pytest]
prerequisites:
  knowledge:
    - "Validation rules and quarantine (DS-T1-027)"
    - "Incremental pipelines (DS-T2-023)"
    - "Robust statistics: medians, MAD, quantiles"
    - "False-positive and false-negative trade-offs"
  recommended_assessments: [DS-T1-027, DS-T2-023]
competencies:
  - "Classifying schema changes by consumer impact"
  - "Expressing a data contract as rules with tolerated rates"
  - "Detecting semantic drift that leaves the schema unchanged"
  - "Calibrating thresholds against normal variation (inflation, weekly volume)"
  - "Fault injection to estimate detection rate and false-alarm rate"
  - "Designing an accept, quarantine or block policy with stated costs"
