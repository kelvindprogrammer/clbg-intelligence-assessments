id: DS-T3-020
title: "Same Schema, Different Truth: A Data-Contract and Drift Gate for a Market-Price Feed"
summary: >-
  Design and implement a data-contract gate for a daily agricultural price feed: classify schema changes, enforce rate-based rules, detect same-schema semantic drift such as a naira-to-kobo unit change, and measure the gate's detection and false-alarm rates with your own fault-injection harness.
version: 1.0.0
status: reviewed
authors: ["CLBG Intelligence Track Assessment Committee"]
reviewers: ["CLBG Intelligence Track Assessment Committee"]
created: 2026-11-03
last_reviewed: 2026-11-03
