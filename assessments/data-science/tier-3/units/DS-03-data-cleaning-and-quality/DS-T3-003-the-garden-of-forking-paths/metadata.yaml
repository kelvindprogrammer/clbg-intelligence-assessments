id: DS-T3-003
title: "The Garden of Forking Paths: A Multiverse Study of Cleaning Choices"
summary: >-
  Specify the space of defensible cleaning and analysis choices for a messy three-round panel
  evaluating solar mini-grids' effect on village enterprise revenue, run every universe
  reproducibly, attribute variation to decisions, and report how robust the conclusion is.
