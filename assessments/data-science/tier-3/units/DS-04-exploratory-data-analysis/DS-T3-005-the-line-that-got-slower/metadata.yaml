id: DS-T3-005
title: "The Line That Got Slower: Decomposing a Headline and Finding the Instrument Break"
summary: >-
  Explore a bus rapid transit delay dataset in which a headline worsening coexists with improvement on every route. Implement an exact rate-versus-mix decomposition, detect a hidden measurement-instrument break in one operator's tracker, correct the headline, and keep a hypothesis ledger that includes refuted ideas.
