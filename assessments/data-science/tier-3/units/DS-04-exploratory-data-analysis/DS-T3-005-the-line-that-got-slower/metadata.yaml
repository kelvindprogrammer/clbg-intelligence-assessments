prerequisites:
  knowledge:
    - pandas groupby and pivot
    - Weighted averages
    - Basic hypothesis-driven analysis
competencies:
  - Hypothesis-driven exploration with a written ledger
  - Rate/mix (Kitagawa) decomposition of a change in an aggregate
  - Detecting Simpson-style reversals
  - Detecting measurement-instrument changes by differencing against peers
  - Estimating and removing a level shift, and quantifying how much a headline depends on it
  - Honest communication of what an exploration can and cannot establish
