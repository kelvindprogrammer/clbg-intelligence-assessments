id: DS-T3-016
title: "Lower the Cut-off? A Credit Decision Where Outcomes Exist Only for the Approved"
summary: >-
  Decide whether a digital lender should lower its approval cut-off when defaults are observed only for approved loans, using a randomised exploration sample, inverse-propensity weighting, decision-level bootstrap uncertainty and minimax-regret robustness, and write the recommendation memo.
