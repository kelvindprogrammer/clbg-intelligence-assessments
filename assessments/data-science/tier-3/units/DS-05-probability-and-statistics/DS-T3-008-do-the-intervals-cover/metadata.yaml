  - Monte Carlo standard error and choosing the number of replications
  - Intraclass correlation and the design effect
  - Cluster-level resampling
  - Studentised (bootstrap-t) intervals and small-sample behaviour
  - Reproducible stochastic code (seeded generators)
  - Arguing from simulation evidence, with its limits
