id: DS-T3-008
title: "Do the Intervals Cover? A Simulation Study of Confidence Intervals for Clustered Claims"
summary: >-
  Implement and compare four interval methods for a mean under cooperative-level clustering with heavy-tailed claims, run a seeded Monte Carlo coverage study with honest Monte Carlo error, find the regime where the standard cluster bootstrap fails, and argue for a better interval.
