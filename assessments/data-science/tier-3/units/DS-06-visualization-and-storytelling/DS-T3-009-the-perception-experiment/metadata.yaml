id: DS-T3-009
title: "The Perception Experiment: Which Chart Do People Read Most Accurately?"
summary: >-
  Replicate the logic of Cleveland and McGill's graphical perception experiment with simulated participants: render honest stimuli and measure their lie factor, design a balanced randomised study, analyse errors at the participant level with bootstrap intervals, and compute the power to recover the true ranking, including in a world where the literature is wrong.
