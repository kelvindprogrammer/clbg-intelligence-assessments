technologies: [python, matplotlib, pandas, numpy, pytest, experimental-design]
prerequisites:
  knowledge:
    - matplotlib patches and axes
    - pandas groupby and pivot
    - Bootstrap confidence intervals
competencies:
  - Encoding magnitudes honestly (position, length, angle, area)
  - Measuring graphical integrity with the lie factor
  - Experimental design (balance, randomisation, counterbalancing, seeds)
  - Participant-level analysis and bootstrap intervals
  - Power by simulation
  - Pre-registration and reporting a null or contrary result honestly
  - Writing a design recommendation from perceptual evidence
