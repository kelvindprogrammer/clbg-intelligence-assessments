id: DS-T3-011
title: "The Agent Ledger Model: Point-in-Time Analytics for a Mobile-Money Network"
summary: >-
  Design and build a DuckDB analytical model over an event-sourced mobile-money ledger: SCD2 agent dimension, latest-version facts with reversals netted, as-of FX conversion, explicit exceptions and a reconciliation that closes. Defend the design with trade-off records.
