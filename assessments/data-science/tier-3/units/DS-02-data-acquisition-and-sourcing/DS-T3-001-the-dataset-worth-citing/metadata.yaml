id: DS-T3-001
title: "The Dataset Worth Citing: A Provenance and Licence Audit of a Data Catalogue"
summary: >-
  Audit a synthetic 24-dataset catalogue for licence laundering, share-alike violations, incompatible mixes, unlicensed upstreams, missing attribution, checksum and row-count drift and provenance cycles. Implement the audit, argue where a simple licence model stops matching the law, and decide what may be reused.
