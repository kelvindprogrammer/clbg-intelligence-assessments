technologies: [python, pytest, json, graph-algorithms]
prerequisites:
  knowledge:
    - Python dataclasses and graph traversal
    - Basic understanding of Creative Commons licences
    - Hashing with hashlib
competencies:
  - Provenance graph construction and traversal (DAG, cycles)
  - Licence propagation and compatibility reasoning
  - Share-alike, non-commercial and attribution obligations
  - Integrity verification with checksums and row counts
  - Distinguishing what a tool can decide from what needs a lawyer
  - Writing a defensible reuse decision memo
  - Citing data correctly
